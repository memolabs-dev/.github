name: Verify Memo Labs GitHub App

# Manual proof only. No PR code checkout, no write operations, no deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-installation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail clearly if app credentials are not configured
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.MEMOLABS_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.MEMOLABS_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_CLIENT_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::Set MEMOLABS_APP_CLIENT_ID repository variable and MEMOLABS_APP_PRIVATE_KEY repository secret."
            exit 1
          fi

      - name: Mint a short-lived installation token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MEMOLABS_APP_CLIENT_ID }}
          private-key: ${{ secrets.MEMOLABS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: .github
          permission-contents: read

      - name: Verify current repository is accessible to the installation
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          gh api /installation/repositories --jq '.repositories[].full_name' |
            grep -Fx -- "$GITHUB_REPOSITORY" >/dev/null
          echo "GitHub App installation verified for $GITHUB_REPOSITORY (read-only)."
