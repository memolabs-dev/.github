  "github-apps/memo-labs-guardian.manifest.json",
  "github-apps/memo-labs-release.manifest.json",
  "scripts/app-status.py",
  "scripts/guardian-ci-preflight.py",
  "scripts/guardrails-audit.py",
  "scripts/post-activation.py",
  "scripts/radar.py",
